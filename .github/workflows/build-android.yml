name: build-android

on:
  push:
    branches: [android-port]
    paths:
      - 'crates/pi-natives/**'
      - 'packages/natives/native/**'
      - 'patches/**'
      - 'scripts/build-android.sh'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [android-port]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed to attach to releases

jobs:
  build:
    name: build pi_natives.android-arm64.node
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git apply needs the full history for context lines

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install Rust (stable)
        # The repo pins to nightly via rust-toolchain.toml; dtolnay's
        # action's `targets:` input is ignored for non-stable toolchains.
        # We install stable first to get rustup, then override the
        # active toolchain to the pinned nightly and add the target.
        uses: dtolnay/rust-toolchain@stable

      - name: Activate repo-pinned nightly and add Android target
        run: |
          rustup show 2>&1 | head -20
          ACTIVE=$(rustup show active-toolchain | awk '{print $1}')
          echo "Active toolchain: $ACTIVE"
          rustup target add aarch64-linux-android --toolchain "$ACTIVE"
          rustc +"$ACTIVE" --print target-list | grep aarch64-linux-android || true

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Install NDK r27
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Export NDK env
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: scripts/build-android.sh

      - name: "Smoke: file type"
        run: file packages/natives/native/pi_natives.android-arm64.node

      - name: "Smoke: exported sentinel"
        run: |
          set -e
          # The sentinel name is updated on every upstream release.
          EXPECTED="__piNativesV$(awk -F'"' '/"version"/{print $4; exit}' packages/natives/package.json | tr -c '[:alnum:]' '_')"
          if ! nm -D packages/natives/native/pi_natives.android-arm64.node | grep -q "$EXPECTED"; then
            echo "ERROR: sentinel $EXPECTED not found in prebuilt .node" >&2
            nm -D packages/natives/native/pi_natives.android-arm64.node | head -20
            exit 1
          fi
          echo "Sentinel $EXPECTED is exported."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi_natives-android-arm64
          path: |
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
